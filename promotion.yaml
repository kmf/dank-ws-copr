# Promotion policy: kmf/dank-ws-copr (rolling) -> kmf/dank-ws-copr-stable (stable).
# Read by scripts/promote.py. See README.md "Release tracks".

rolling: kmf/dank-ws-copr
stable: kmf/dank-ws-copr-stable

# A build must have succeeded on all of a package's chroots on rolling at least
# this many days ago before it is promoted.
bake_days: 7

# Default chroots every package must have succeeded on (and is built for in stable).
chroots:
  - centos-stream-10-x86_64
  - centos-stream-10-aarch64
  - epel-10-x86_64
  - epel-10-aarch64

# Per-package overrides.
packages:
  ghostty:
    # needs zig, which EPEL only ships for x86_64
    chroots: [centos-stream-10-x86_64, epel-10-x86_64]

# Never promote these automatically (stable keeps whatever it has).
# Example: - hyprland
holds: []

# Only ever promote this exact version-release (stable is held at it).
# Example: cava: 1.0.0-1
pins: {}

# Packages that must move to stable together (ABI-coupled): a group is only
# promoted when every member's newest rolling build has baked, so stable never
# mixes e.g. a new mir with a miracle-wm built against the old one.
groups:
  - [mir, miracle-wm]
  - [iniparser, cava]
  - [rust-input-sys, rust-input]

# Dependency order. Each wave is a COPR batch that starts only after the
# previous wave's batch has finished; packages within a wave build in
# parallel. Packages that change in a promotion run keep this ordering;
# unchanged packages are simply skipped. A package on rolling that isn't
# listed here is appended to the last wave with a warning.
waves:
  # 1: no in-repo build deps
  - [pixman, libdrm, libxkbcommon, lua, iniparser, muparser, libspng,
     hyprwayland-scanner, hyprland-protocols, gtk4-layer-shell, umockdev,
     python-dbusmock, rust-pam-sys, rust-enquote, rust-greetd_ipc,
     rust-rpassword5, rust-calloop, rust-input-sys]
  # 2: need wave 1 (pixman/libdrm/xkbcommon, rust crates, iniparser, gtk4-layer-shell)
  - [hyprutils, wlroots0.19, wlroots0.20, rust-input, greetd, cava,
     alacritty, kitty, ghostty]
  # 3
  - [hyprlang, hyprwire, aquamarine, scenefx, mir]
  # 4
  - [hyprcursor, hyprgraphics, mangowm, miracle-wm]
  # 5
  - [hyprtoolkit]
  # 6
  - [hyprland, hyprland-guiutils]
