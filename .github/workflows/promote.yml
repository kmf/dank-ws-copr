name: Promote rolling -> stable

# Promotes builds that have baked on kmf/dank-ws-copr (rolling) for
# promotion.yaml's bake_days into kmf/dank-ws-copr-stable (stable).
# Needs a COPR_CONFIG repository secret holding a copr-cli config
# (the block from https://copr.fedorainfracloud.org/api/).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Submit builds (unchecked = dry run)"
        type: boolean
        default: true
      packages:
        description: "Comma-separated subset of packages (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: copr-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install copr client
        run: pip install copr pyyaml

      - name: Write COPR config
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::COPR_CONFIG secret is not set"; exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Promote
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply --wait); fi
          if [ -n "$PACKAGES" ]; then args+=(--packages "$PACKAGES"); fi
          python scripts/promote.py "${args[@]}"
